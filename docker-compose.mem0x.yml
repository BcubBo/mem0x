# mem0x API 服务
# 启动顺序: docker compose -f docker-compose.redis.yml up -d
#           docker compose -f docker-compose.embedding.yml up -d
#           docker compose -f docker-compose.mem0x.yml up -d

services:
  mem0x:
    image: mem0xapi:v0.1.42
    container_name: mem0xAPI
    restart: unless-stopped
    ports:
      - "127.0.0.1:28768:28768"
    volumes:
      - /home/ubuntu/workspace/.mem0x/data:/app/data
      - /home/ubuntu/workspace/.mem0x/data/fastembed:/tmp/fastembed_cache
      - /home/ubuntu/workspace/.mem0x/config-compose.json:/app/config.json:ro
    environment:
      MEM0X_CONFIG: /app/config.json
      MEM0_TELEMETRY: "False"
      DO_NOT_TRACK: "1"
      FASTEMBED_CACHE_PATH: "/tmp/fastembed_cache"
      HF_HUB_OFFLINE: "1"
    networks:
      - mem0x-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:28768/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  mem0x-net:
    external: true
