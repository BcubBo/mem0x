[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem0x-mcp"
version = "0.2.1"
description = "mem0x MCP Server — long-term memory for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3.0",
    "httpx>=0.27",
]

[project.scripts]
mem0x-mcp = "mem0x_mcp_server:cli"

[tool.hatch.build.targets.wheel]
packages = ["."]
