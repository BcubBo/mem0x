# Neo4j 知识图谱
# 启动: sudo docker compose -f docker-compose.mem0x-neo4j.yml up -d

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ${NEO4J_DATA_DIR:-~/.mem0x/neo4j_data}:/data
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    networks:
      - mem0x-net

networks:
  mem0x-net:
    external: true
