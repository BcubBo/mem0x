networks:
  mem0x-net:
    external: true
services:
  embedding:
    container_name: mem0x-embedding
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_MODEL_PATH: /app/models/BAAI/bge-m3
      PORT: '28770'
      WORKERS: '16'
    image: mem0x-embedding:latest
    mem_limit: 2.5g
    networks:
    - mem0x-net
    ports:
    - 127.0.0.1:28770:28770
    restart: unless-stopped
    volumes:
    - /home/ubuntu/workspace/.mem0x/data/fastembed/bge-m3:/app/models/BAAI/bge-m3:ro
