# Qdrant 向量数据库
# 启动: sudo docker compose -f docker-compose.mem0x-qdrant.yml up -d

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ${QDRANT_DATA_DIR:-~/.mem0x/qdrant_data}:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - mem0x-net

networks:
  mem0x-net:
    external: true
