upstream embedding_backend {
    server mem0x-embedding:28770;
}

upstream reranker_backend {
    server mem0x-reranker-n1:8790;
}

server {
    listen 28770;

    location /v1/embeddings {
        proxy_pass http://embedding_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /v1/rerank {
        proxy_pass http://reranker_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        return 200 '{"status":"ok","services":["embedding","reranker"]}';
        add_header Content-Type application/json;
    }
}
